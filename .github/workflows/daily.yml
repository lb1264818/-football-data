name: sportsdb-daily
on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python fetch.py
        env:
          SPORTSDB_KEY: ${{ secrets.SPORTSDB_KEY }}
      - run: python fetch_ou.py || true
      - run: python bt_model.py || true
      - run: python verify_leagues.py || true
      - run: |
          git config user.name "sportsdb-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data
          git commit -m "data $(date -u +%F)" || echo "no change"
          git push

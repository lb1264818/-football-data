name: sportsdb-daily
on:
  schedule:
    - cron: "0 1 * * *"        # 09:00 CST
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: fetch teams (thesportsdb)
        run: python fetch.py
        env:
          SPORTSDB_KEY: ${{ secrets.SPORTSDB_KEY }}

      - name: fetch over/under odds
        run: python fetch_ou.py || true

      - name: backtest model v4
        run: python bt_model.py || true

      - name: line move / CLV study v5
        run: python bt_clv.py || true

      - name: clv tracker (ledger)
        run: python clv_track.py || true
        env:
          ODDS_KEY: ${{ secrets.ODDS_KEY }}

      # ext_odds 需要 numpy + scipy(拟合 Dixon-Coles / 匈牙利指派), 其余脚本都是纯 stdlib
      - name: install deps for ext_odds
        run: pip install --quiet numpy scipy

      # 外部欧赔锚: 走 The Odds API(已有 ODDS_KEY, 境外可达, h2h/spreads/totals 三市场)
      # 为什么不再退回 betexplorer: 机房 IP 实测 40 次全 429; 且退回会覆盖 anchor_log,
      #   把 Odds API 的真实失败原因冲掉 —— 宁可红一次看日志, 不要假绿。
      # 竞彩接口只认大陆 IP(境外一律 567), 所以 CI 只产锚库,
      #   竞彩抓取 + 对齐 + EV 在境内机器跑 python ext_odds.py(默认 full 模式)
      - name: external odds anchor (欧赔/亚盘/大小球) [CI 仅产锚库]
        run: python ext_odds.py --anchor-only --provider=oddsapi || true
        env:
          ODDS_KEY: ${{ secrets.ODDS_KEY }}

      - name: league id check
        run: python verify_leagues.py || true
        env:
          SPORTSDB_KEY: ${{ secrets.SPORTSDB_KEY }}

      - name: commit data
        run: |
          git config user.name "sportsdb-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data
          git commit -m "data $(date -u +%F)" || echo "no change"
          git push
